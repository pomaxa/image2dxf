[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "img2dxf"
version = "0.1.0"
description = "Convert raster images to monochrome previews and DXF polylines for laser cutting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.scripts]
img2dxf = "img2dxf.cli:main"
img2dxf-web = "img2dxf.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
img2dxf = ["web_assets/*"]
